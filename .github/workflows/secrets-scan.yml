# Drop this in as .github/workflows/secrets-scan.yml in any repo produced by the
# isconl-agent split. Runs on every push and PR, regardless of which machine or
# Claude/human account made the commit -- enforcement lives in the repo, not in
# any one session's discipline.
name: secrets-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not just the last commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails the check (blocks merge if branch protection requires it) on any finding.

  # Second job: a small custom pattern list for things gitleaks' generic rules
  # miss -- hardcoded personal identifiers, not secret-shaped but exactly what
  # this project needs blocked (names/places/tenant-specific IDs baked into code).
  identity-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded identity markers
        run: |
          # Extend this list per-repo as real patterns are found -- keep it a
          # denylist of THIS project's known personal identifiers, not a generic
          # PII scanner (those over-trigger on legitimate string content).
          PATTERN='sconl peter|sconl@proton\.me|\bswen\b|\bjoel\b|\bkarmen\b|\bevans\b|\bfred\b'
          if grep -rIniE "$PATTERN" --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "::error::Hardcoded personal identifier found -- see matches above. This repo is meant to be tenant-agnostic; move this to config/vault, never source."
            exit 1
          fi
